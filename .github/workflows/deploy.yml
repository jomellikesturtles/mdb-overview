name: Deploy to GitHub Pages

on:
  push:
    branches: [master] # Triggers the workflow on push to the main branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Print
        run: echo "Checking out"
      - name: Checkout
        uses: actions/checkout@v4 # Use the checkout action to get your code
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Minifiers
        run: npm install -g html-minifier-terser clean-css-cli terser

      - name: Create output folder
        run: mkdir -p output
      - name: Copy assets (images, etc)
        run: cp -r vanilla-portfolio/assets output/
      - name: Minify HTML (removes comments, whitespace, and inlines minified CSS/JS)
        run: html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true -o output/index.html vanilla-portfolio/index.html
      - name: Minify CSS                                                                                                   │
        run: cleancss -o output/styles.css vanilla-portfolio/styles.css

      - name: Minify JS ()
        run: terser vanilla-portfolio/script.js --compress --mangle -o output/script.js

      - name: Copy root files
        run: cp vanilla-portfolio/favicon.ico output/ 2>/dev/null || true
      - name: Print
        run: echo "Uploading artifact"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # Uploads the static files
        with:
          path: "./output"
      - name: Print
        run: echo "Deploying to Github Pages"

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4 # The official GitHub Pages deployment action

  docker-build-push:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mdb-overview:latest

  sync-to-platform:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Minifiers
        run: npm install -g html-minifier-terser clean-css-cli terser

      - name: Build Minified Assets
        run: |
          mkdir -p output
          cp -r vanilla-portfolio/assets output/
          html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true -o output/index.html vanilla-portfolio/index.html
          cleancss -o output/styles.css vanilla-portfolio/styles.css
          terser vanilla-portfolio/script.js --compress --mangle -o output/script.js
          cp vanilla-portfolio/footer.js output/ 2>/dev/null || true

      - name: Checkout Target (mdb-platform)
        uses: actions/checkout@v4
        with:
          repository: jomellikesturtles/mdb-platform
          token: ${{ secrets.PAT_GITHUB }}
          path: mdb-platform

      - name: Create Pull Request on mdb-platform
        run: |
          cd mdb-platform
          # Update assets in the subfolder
          rm -rf mdb-overview/assets mdb-overview/index.html mdb-overview/styles.css mdb-overview/script.js mdb-overview/footer.js
          cp -r ../output/* mdb-overview/
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="sync-overview-$(date +%Y%m%d%H%M%S)"
          git checkout -b $BRANCH_NAME
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          
          git commit -m "chore: sync assets from mdb-overview"
          git push origin $BRANCH_NAME
          
          gh auth status

          gh pr create \
            --repo jomellikesturtles/mdb-platform \
            --title "Sync: Portfolio Assets Update" \
            --body "Automated PR to sync built assets from mdb-overview repo." \
            --base master \
            --head $BRANCH_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}
