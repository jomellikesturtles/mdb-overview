name: Deploy to GitHub Pages with Branch Input

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        type: string
        default: 'master'

permissions:
  contents: read
  pages: write
  id-token: write


# Restricts deployment concurrency per environment or workflow
concurrency:
  group: deploy-environment-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    if: |
      github.event.inputs.branch == 'master' ||
      startsWith(github.event.inputs.branch, 'release')
    steps:
      - name: Print
        run: echo "Checking out"
      - name: Checkout
        uses: actions/checkout@v4 # Use the checkout action to get your code
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Minifiers
        run: npm install -g html-minifier-terser clean-css-cli terser

      - name: Create output folder
        run: mkdir -p output
      - name: Copy assets (images, etc)
        run: cp -r vanilla-portfolio/assets output/
      - name: Minify HTML (removes comments, whitespace, and inlines minified CSS/JS)
        run: html-minifier-terser --input-dir ./vanilla-portfolio --output-dir ./output --file-ext html --collapse-whitespace --remove-comments --remove-redundant-attributes --use-short-doctype --minify-js true --minify-css true
      - name: Minify CSS
        run: cleancss -o output/styles.css vanilla-portfolio/styles.css

      - name: Minify JS ()
        run: terser vanilla-portfolio/script.js --compress --mangle -o output/script.js

      - name: Copy root files
        run: cp vanilla-portfolio/favicon.ico output/ 2>/dev/null || true
      - name: Print
        run: echo "Uploading artifact"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # Uploads the static files
        with:
          path: "./output"
      - name: Print
        run: echo "Deploying to Github Pages"

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v4 # The official GitHub Pages deployment action

  docker-build-push:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mdb-overview:latest

  sync-to-platform:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Minifiers
        run: npm install -g html-minifier-terser clean-css-cli terser

      - name: Build Minified Assets
        run: |
          mkdir -p output
          cp -r vanilla-portfolio/assets output/
          html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true -o output/index.html vanilla-portfolio/index.html
          cleancss -o output/styles.css vanilla-portfolio/styles.css
          terser vanilla-portfolio/script.js --compress --mangle -o output/script.js
          cp vanilla-portfolio/footer.js output/ 2>/dev/null || true

      - name: Checkout Target (mdb-platform)
        uses: actions/checkout@v4
        with:
          repository: jomellikesturtles/mdb-platform
          token: ${{ secrets.PAT_GITHUB }}
          path: mdb-platform

      - name: Update assets in mdb-platform
        run: |
          mkdir -p mdb-platform/mdb-overview
          # Clean up old assets to ensure a clean sync
          rm -rf mdb-platform/mdb-overview/assets
          # Copy everything from output to the target subfolder
          cp -r output/* mdb-platform/mdb-overview/

      - name: Create Pull Request on mdb-platform
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_GITHUB }}
          path: mdb-platform
          commit-message: "chore: sync assets from mdb-overview"
          branch: sync-portfolio-assets
          delete-branch: true
          title: "Sync: Portfolio Assets Update"
          body: |
            Automated PR to sync built assets from mdb-overview repo.

            This PR updates the minified assets in `mdb-overview/` subfolder.
          base: master
